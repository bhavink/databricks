# Workspace IP access lists. Used when enable_ip_access_list = true.
# An ALLOW list restricts the workspace to these ranges only: include the IP
# you run Terraform from, or you lock yourself out. Replace the examples.
#
# <label>:
#   list_type: ALLOW | BLOCK
#   ip_addresses: [CIDR or single IP, ...]

office-allow:
  list_type: ALLOW
  ip_addresses:
    - 203.0.113.0/24 # example office CIDR
    - 198.51.100.10  # example single IP
