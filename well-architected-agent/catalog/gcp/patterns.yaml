# Databricks on Google Cloud reference patterns.
#
# Same model as catalog/azure/patterns.yaml: detection by `signature` in
# `detection_order`, scoring by `required` / `recommended`. Grounded in
# gcpdb4u (battle-tested) and the GCP data exfiltration protection guide.

catalog_version: "2026.10.0"
cloud: gcp

# Same five patterns on every cloud (see catalog/azure/patterns.yaml). On
# Google Cloud, Private Link is Private Service Connect (PSC).
#
# Bare minimum for every pattern and baseline, whatever else is used: an IP
# access list on any public front-end, an enforced serverless egress policy
# and Unity Catalog.
minimum_required:
  - GCP-ING-001
  - GCP-SRV-002
  - GCP-UC-001

detection_order:
  - serverless
  - classic-dep
  - classic-full-pl
  - classic-backend-pl
  - classic-no-pl

patterns:
  - id: serverless
    name: Serverless workspace
    compute_mode: serverless
    tier: 2
    summary: >-
      No customer VPC: compute runs in the Databricks serverless compute
      plane and data in default storage (or your buckets, through Unity
      Catalog). A VPC of yours is needed only for a private front-end (PSC).
      Governed by IP access lists, an NCC and an enforced serverless egress
      policy.
    signature: {fact: workspace.compute_mode, op: equals, value: serverless}
    references:
      - https://docs.databricks.com/gcp/en/admin/workspace/serverless-workspaces
      - gcpdb4u/templates/terraform-scripts/serverless-ws
    required:
      - GCP-SRV-001
      - GCP-OPS-001
    recommended:
      - GCP-ENC-001
      - GCP-WS-001
      - GCP-ING-002

  - id: classic-dep
    name: Classic — data exfiltration protection (VPC Service Controls)
    compute_mode: classic
    tier: 3
    summary: >-
      Your VPC with front-end and back-end Private Service Connect and no
      public access, a VPC Service Controls perimeter, Google APIs over
      restricted.googleapis.com, deny-by-default egress, customer-managed keys.
      Assessed against the GCP data exfiltration protection guide.
    signature:
      all_of:
        - {fact: workspace.customer_managed_vpc, op: equals, value: true}
        - {fact: network.service_perimeter, op: equals, value: true}
    references:
      - https://www.databricks.com/blog/databricks-gcp-practitioners-guide-data-exfiltration-protection
      - gcpdb4u/security/Configure-VPC-SC.md
      - gcpdb4u/templates/vpcsc-policy
    required:
      - GCP-NET-001
      - GCP-NET-003
      - GCP-NET-005
      - GCP-NET-006
      - GCP-NET-007
      - GCP-PL-001
      - GCP-PL-002
      - GCP-PL-003
      - GCP-DNS-001
      - GCP-ENC-001
      - GCP-ENC-002
      - GCP-UC-001
      - GCP-OPS-001
      - GCP-SRV-001
    recommended:
      - GCP-NET-002
      - GCP-NET-004
      - GCP-PL-004
      - GCP-WS-001
      - GCP-ING-002

  - id: classic-full-pl
    name: Classic — your VPC, full Private Service Connect (front-end and back-end)
    compute_mode: classic
    tier: 3
    summary: >-
      Private Service Connect for users (front-end) and for compute (back-end),
      private DNS, Private Google Access. Public access is off, unless you
      choose to allow selected clients on known IPs (IP access lists).
    signature:
      all_of:
        - {fact: workspace.customer_managed_vpc, op: equals, value: true}
        - {fact: private_link.backend_psc, op: equals, value: true}
        - {fact: private_link.frontend_psc, op: equals, value: true}
    references:
      - https://docs.databricks.com/gcp/en/security/network/classic/private-service-connect
      - gcpdb4u/templates/terraform-scripts/byovpc-psc-cmek-ws
    required:
      - GCP-NET-001
      - GCP-NET-003
      - GCP-PL-001
      - GCP-PL-002
      - GCP-PL-003
      - GCP-DNS-001
      - GCP-UC-001
      - GCP-OPS-001
      - GCP-SRV-001
    recommended:
      - GCP-NET-002
      - GCP-NET-004
      - GCP-NET-005
      - GCP-PL-004
      - GCP-ENC-001
      - GCP-ENC-002
      - GCP-WS-001
      - GCP-ING-002

  - id: classic-backend-pl
    name: Classic — your VPC, back-end Private Service Connect only
    compute_mode: classic
    tier: 2
    summary: >-
      Compute reaches the control plane over Private Service Connect; users
      reach the workspace over the internet, restricted by IP access lists.
    signature:
      all_of:
        - {fact: workspace.customer_managed_vpc, op: equals, value: true}
        - {fact: private_link.backend_psc, op: equals, value: true}
    references:
      - https://docs.databricks.com/gcp/en/security/network/classic/private-service-connect
      - gcpdb4u/templates/terraform-scripts/byovpc-psc-ws
    required:
      - GCP-NET-001
      - GCP-NET-003
      - GCP-NET-004
      - GCP-PL-001
      - GCP-UC-001
      - GCP-OPS-001
      - GCP-SRV-001
    recommended:
      - GCP-NET-002
      - GCP-PL-002
      - GCP-DNS-001
      - GCP-ENC-001
      - GCP-ENC-002
      - GCP-WS-001
      - GCP-ING-002

  - id: classic-no-pl
    name: Classic — your VPC, no Private Service Connect
    compute_mode: classic
    tier: 1
    summary: >-
      Your VPC (new, existing or shared) with Private Google Access and Cloud
      NAT; public front-end restricted by IP access lists.
    # Last in detection_order: every classic workspace not matched above.
    signature: {fact: workspace.compute_mode, op: equals, value: classic}
    references:
      - https://docs.databricks.com/gcp/en/security/network/classic/customer-managed-vpc
      - gcpdb4u/templates/terraform-scripts/byovpc-ws
    required:
      - GCP-NET-001
      - GCP-NET-003
      - GCP-NET-004
      - GCP-UC-001
      - GCP-OPS-001
    recommended:
      - GCP-NET-002
      - GCP-SRV-001
      - GCP-PL-001
      - GCP-ENC-001
      - GCP-ENC-002
      - GCP-WS-001
      - GCP-ING-002
