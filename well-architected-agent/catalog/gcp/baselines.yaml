# Databricks on Google Cloud baselines.
#
# Same model as catalog/azure/baselines.yaml. Ground truth is gcpdb4u, used
# as-is. Each baseline offers several builds, as peers (no default):
#   lpw           one root (gcpdb4u lpw), two applies
#   new-vpc       infra4db -> byovpc-* -> workspace-guardrails
#   existing-vpc  byovpc-* -> workspace-guardrails
# workspace-guardrails adds the bare minimum (IP access lists, NCC, enforced
# serverless network policy) that the byovpc-* roots don't include.
# Stage values may use ${var.name} (an answer or earlier stage value) and
# `outputs` (an earlier root's terraform output, read at plan time).
# Data exfiltration protection is assess-only: no build.

baselines:
- id: gcp-classic-standard
  name: Classic — standard
  use_case: Customer-managed VPC with Private Google Access and Cloud NAT; public front-end restricted by IP access
    lists; enforced serverless egress policy. Dev/test or low-sensitivity data.
  pattern: gcp-classic-byovpc
  deployment: gcpdb4u/templates/terraform-scripts/byovpc-ws
  require: []
  builds:
  - id: lpw
    for: One root creates the VPC, least-privilege service accounts and CMK, in two applies (lpw is generally available).
    deployment: gcpdb4u/templates/terraform-scripts/lpw
    prepare:
    - In terraform/gcpdb4u/templates/terraform-scripts/lpw run ./prereqs.sh once per GCP project (APIs, service
      agents, deployer roles), then add the deployer service account as an account admin in the account console
      (RUNBOOK.md step 0).
    - Create account groups once (identities/) and note your regional metastore name (metastore/), as in RUNBOOK.md
      steps 1-2.
    stages:
    - name: provision
      note: 'Apply 1 of 2: everything is built and the workspace is created bare. First edit ip_access_list.yaml
        (include the IP you run Terraform from) and network_policy.yaml (destinations serverless workloads need)
        in this folder.'
      tfvars:
        expected_workspace_status: PROVISIONING
        create_vpc: true
        enable_private_access: false
        public_access_enabled: true
        enable_ip_access_list: true
        enable_ncc: true
        enable_network_policy: true
        network_policy_enforcement_mode: ENFORCED
        metastore_name: ${var.metastore_name}
    - name: running
      note: 'Apply 2 of 2: attaches the network, keys, PSC, NCC, metastore, IP access lists and the serverless network
        policy.'
      tfvars:
        expected_workspace_status: RUNNING
  - id: new-vpc
    for: 'Teams that keep the network in its own Terraform root: infra4db creates the VPC, then byovpc-ws creates
      the workspace on it.'
    stages:
    - name: network
      deployment: gcpdb4u/templates/terraform-scripts/infra4db
      copy_example: terraform.tfvars.remove
      note: Creates the VPC, subnet, Cloud NAT, firewall rules and Google APIs DNS. Key subnet_configs and psc_attachments
        by region, as in its example.
      tfvars:
        workspace_type: non-psc
        create_psc_resources: false
        create_cmk_resources: false
        databricks_regions:
          ${var.google_region}:
            region: ${var.google_region}
    - name: workspace
      deployment: gcpdb4u/templates/terraform-scripts/byovpc-ws
      note: Set the rest in this root's providers.auto.tfvars and workspace.auto.tfvars, including databricks_account_id
        (a value there overrides the environment variable).
      tfvars:
        google_vpc_id: ${var.network_name}
        node_subnet: subnet-${var.google_region}
    - name: guardrails
      deployment: gcpdb4u/templates/terraform-scripts/workspace-guardrails
      note: 'Bare-minimum controls the workspace root doesn''t include: IP access lists, an NCC and an enforced
        serverless network policy. First edit ip_access_list.yaml (include your own IP) and network_policy.yaml
        in this folder.'
      tfvars:
        enable_ip_access_list: true
        enable_ncc: true
        enable_network_policy: true
        network_policy_enforcement_mode: ENFORCED
      outputs:
        workspace_url:
          stage: 2
          output: workspace_url
  - id: existing-vpc
    for: 'Teams with an existing VPC (or shared VPC): byovpc-ws creates the workspace on it.'
    stages:
    - name: workspace
      deployment: gcpdb4u/templates/terraform-scripts/byovpc-ws
      note: Set the VPC, subnet of your existing network, and the rest, in this root's providers.auto.tfvars and
        workspace.auto.tfvars, including databricks_account_id (a value there overrides the environment variable).
      tfvars: {}
    - name: guardrails
      deployment: gcpdb4u/templates/terraform-scripts/workspace-guardrails
      note: 'Bare-minimum controls the workspace root doesn''t include: IP access lists, an NCC and an enforced
        serverless network policy. First edit ip_access_list.yaml (include your own IP) and network_policy.yaml
        in this folder.'
      tfvars:
        enable_ip_access_list: true
        enable_ncc: true
        enable_network_policy: true
        network_policy_enforcement_mode: ENFORCED
      outputs:
        workspace_url:
          stage: 1
          output: workspace_url
