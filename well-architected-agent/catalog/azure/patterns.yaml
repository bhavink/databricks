# Azure Databricks reference patterns.
#
# A pattern is a proven deployment architecture. The engine:
#   1. detects which pattern a deployment currently matches (first matching
#      `signature`, evaluated in `detection_order`), and
#   2. scores it against a target pattern (declared with --target, or the
#      detected one) using that pattern's `required` / `recommended` checks.
#
# Classic = customer-managed (BYO) network for classic compute.
# Serverless = serverless-only workspace (no customer VNet). Serverless
# checks (NCC, network policy) also apply to classic workspaces, because
# classic workspaces run serverless SQL / notebooks / jobs too.

catalog_version: "2026.10.0"
cloud: azure

# Same five patterns on every cloud: classic (your own VNet/VPC) with no
# Private Link, back-end Private Link only, full Private Link (front-end and
# back-end), data exfiltration protection, and serverless.
#
# Bare minimum for every pattern and baseline, whatever else is used: an IP
# access list on any public front-end (inbound users and apps), an enforced
# serverless egress policy and Unity Catalog. The loader adds these to every
# pattern's `required` list.
minimum_required:
  - AZ-ING-001
  - AZ-SRV-002
  - AZ-UC-001

detection_order:
  - serverless
  - classic-dep
  - classic-full-pl
  - classic-backend-pl
  - classic-no-pl

patterns:
  - id: serverless
    name: Serverless workspace
    compute_mode: serverless
    tier: 2
    summary: >-
      No customer VNet: compute runs in the Databricks serverless compute plane.
      A VNet of yours is needed only for a private front-end (Private Link).
      Governed by IP access lists, NCC private endpoint rules and an enforced
      serverless egress policy.
    signature: {fact: workspace.compute_mode, op: equals, value: serverless}
    references:
      - https://learn.microsoft.com/en-us/azure/databricks/security/network/serverless-network-security/
      - adb4u/docs/guides/01-SERVERLESS-SETUP.md
    required:
      - AZ-SRV-001
      - AZ-UC-001
      - AZ-OPS-001
    recommended:
      - AZ-WS-001
      - AZ-SRV-003
      - AZ-ENC-001
      - AZ-ING-002

  - id: classic-dep
    name: Classic — data exfiltration protection (hub-spoke egress firewall)
    compute_mode: classic
    tier: 3
    summary: >-
      Your VNet (a spoke) peered to a hub with Azure Firewall (or NVA). UDR
      0.0.0.0/0 to the firewall, FQDN allowlisting, Private Link front-end and
      back-end, storage over private endpoints, CMK. Assessed against the Azure
      data exfiltration protection blog.
    signature:
      all_of:
        - {fact: workspace.vnet_injected, op: equals, value: true}
        - {fact: network.default_route_to_appliance, op: equals, value: true}
    references:
      - https://www.databricks.com/blog/data-exfiltration-protection-with-azure-databricks
      - adb4u/README.md
    required:
      - AZ-NET-001
      - AZ-NET-002
      - AZ-NET-003
      - AZ-NET-004
      - AZ-NET-006
      - AZ-NET-008
      - AZ-NET-011
      - AZ-PL-001
      - AZ-PL-002
      - AZ-PL-003
      - AZ-DNS-001
      - AZ-STO-001
      - AZ-STO-002
      - AZ-SRV-001
      - AZ-UC-001
      - AZ-UC-002
      - AZ-OPS-001
    recommended:
      - AZ-NET-010
      - AZ-OPS-002
      - AZ-WS-001
      - AZ-NET-009
      - AZ-NET-007
      - AZ-PL-004
      - AZ-ENC-001
      - AZ-ENC-002
      - AZ-ENC-003
      - AZ-SRV-003
      - AZ-ING-002

  - id: classic-full-pl
    name: Classic — your VNet, full Private Link (front-end and back-end)
    compute_mode: classic
    tier: 3
    summary: >-
      Private Link for users (front-end, with browser authentication) and for
      compute (back-end); DBFS over private endpoints. Public access is off,
      unless you choose to allow selected clients on known IPs (IP access lists).
    signature:
      all_of:
        - {fact: workspace.vnet_injected, op: equals, value: true}
        - {fact: private_link.ui_api, op: equals, value: true}
        - {fact: private_link.browser_authentication, op: equals, value: true}
    references:
      - adb4u/docs/patterns/02-FULL-PRIVATE.md
      - adb4u/deployments/full-private
    required:
      - AZ-NET-001
      - AZ-NET-002
      - AZ-NET-003
      - AZ-NET-004
      - AZ-PL-001
      - AZ-PL-002
      - AZ-PL-003
      - AZ-PL-004
      - AZ-DNS-001
      - AZ-STO-001
      - AZ-SRV-001
      - AZ-SRV-003
      - AZ-UC-001
      - AZ-UC-002
      - AZ-OPS-001
    recommended:
      - AZ-WS-001
      - AZ-NET-009
      - AZ-STO-002
      - AZ-ENC-001
      - AZ-ENC-002
      - AZ-ENC-003
      - AZ-ING-002

  - id: classic-backend-pl
    name: Classic — your VNet, back-end Private Link only
    compute_mode: classic
    tier: 2
    summary: >-
      Compute reaches the control plane over Private Link; users reach the
      workspace over the internet, restricted by IP access lists.
    signature:
      all_of:
        - {fact: workspace.vnet_injected, op: equals, value: true}
        - {fact: private_link.ui_api, op: equals, value: true}
    references:
      - https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/private-link
      - adb4u/modules/workspace/variables.tf
    required:
      - AZ-NET-001
      - AZ-NET-002
      - AZ-NET-003
      - AZ-NET-004
      - AZ-NET-005
      - AZ-PL-001
      - AZ-PL-003
      - AZ-DNS-001
      - AZ-SRV-001
      - AZ-UC-001
      - AZ-UC-002
      - AZ-OPS-001
    recommended:
      - AZ-NET-009
      - AZ-NET-007
      - AZ-NET-008
      - AZ-STO-002
      - AZ-ENC-001
      - AZ-ENC-002
      - AZ-ENC-003
      - AZ-ING-002

  - id: classic-no-pl
    name: Classic — your VNet, no Private Link
    compute_mode: classic
    tier: 1
    summary: >-
      VNet-injected with secure cluster connectivity (no public IPs), NAT
      Gateway for stable egress, storage via service endpoints (and service
      endpoint policies), NCC for serverless, IP access lists on the public
      front-end.
    # Last in detection_order: every classic workspace not matched above.
    signature: {fact: workspace.compute_mode, op: equals, value: classic}
    references:
      - adb4u/docs/patterns/01-NON-PL.md
      - adb4u/deployments/non-pl
    required:
      - AZ-NET-001
      - AZ-NET-002
      - AZ-NET-003
      - AZ-NET-004
      - AZ-NET-005
      - AZ-NET-007
      - AZ-SRV-001
      - AZ-UC-001
      - AZ-UC-002
      - AZ-OPS-001
    recommended:
      - AZ-NET-009
      - AZ-NET-008
      - AZ-ENC-001
      - AZ-ENC-002
      - AZ-ENC-003
      - AZ-ING-002
