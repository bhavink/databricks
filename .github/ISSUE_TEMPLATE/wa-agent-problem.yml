name: Well-Architected Agent — problem or question
description: Something didn't work, was unclear, or a finding looks wrong.
title: "[wa-agent] "
labels: ["wa-agent"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't paste subscription, tenant or account IDs, workspace URLs, emails, tokens or keys**.
        `wa-agent doctor` output is redacted for you; paste that as-is.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How were you running it?
      options: [Command line (wa-agent), Claude Code (MCP), Codex (MCP), Cursor (MCP), VS Code / Copilot (MCP), Other MCP client]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wa-agent doctor` (redacted by default)
      description: Add `--workspace <name>` if the problem is with a specific workspace.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      placeholder: wa-agent assess --facts ws.facts.json --baseline classic-standard
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: For a finding you believe is wrong, include its check id (e.g. AZ-NET-005) and why.
    validations:
      required: true
  - type: checkboxes
    id: redacted
    attributes:
      label: Before submitting
      options:
        - label: I removed identifiers, tokens and secrets from everything above.
          required: true
